<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ARTEVA Maison - Luxury home décor, handcrafted glassware, and artisan collections. Discover exquisite pieces for your home." />
  <meta name="keywords" content="luxury home décor, artisan glassware, handcrafted vases, decorative plates, Kuwait home décor" />

  <!-- Facebook domain verification.
       Must be in the served HTML, not injected by React: Meta's crawler reads
       the raw source and does not run JavaScript. This file is a static asset
       on Vercel, so the tag is present before any bundle loads.
       Proves ownership of artevamaisonkw.com to Meta, which is what allows
       event prioritisation (Aggregated Event Measurement) and control over how
       our links are previewed. Do not remove — verification is re-checked. -->
  <meta name="facebook-domain-verification" content="qa9tvz1dzhnp0aah10vl3qc78pu9og" />

  <title>ARTÉVA Maison | Luxury Home Décor</title>

  <!-- Default link preview.
       Product URLs are answered by the backend with the real product's title,
       price and photograph — Vercel rewrites crawler traffic for /product/:slug
       there. These are the fallback for every other page: home, collections,
       contact and the policy pages. Without them a shared link previews as a
       bare URL with no title, description or image at all. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ARTÉVA Maison" />
  <meta property="og:title" content="ARTÉVA Maison | Luxury Home Décor" />
  <meta property="og:description" content="Luxury home décor, handcrafted glassware and artisan collections. Discover exquisite pieces for your home." />
  <meta property="og:url" content="https://www.artevamaisonkw.com/" />
  <!-- Served from Cloudinary, resized to the 1200x630 Meta expects by the
       c_fill,w_1200,h_630 transform in the URL. Deliberately not a local path:
       /assets/images/* is not deployed — that folder sits outside public/, so
       Vite never copies it and the catch-all rewrite answers those URLs with
       index.html. A preview image that resolves to HTML shows no image at all.
       To use a proper brand banner instead, upload it to Cloudinary and swap
       the id below, or drop the file in public/ and point this at its path. -->
  <meta property="og:image" content="https://res.cloudinary.com/dbbwduzfa/image/upload/c_fill,w_1200,h_630,q_auto,f_jpg/v1777344385/arteva/products/ede41w0jjkfcvfuiirys.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="ar_AR" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ARTÉVA Maison | Luxury Home Décor" />
  <meta name="twitter:description" content="Luxury home décor, handcrafted glassware and artisan collections." />
  <meta name="twitter:image" content="https://res.cloudinary.com/dbbwduzfa/image/upload/c_fill,w_1200,h_630,q_auto,f_jpg/v1777344385/arteva/products/ede41w0jjkfcvfuiirys.jpg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Cormorant Garamond was dropped: it is named only in --font-serif-alt,
       which nothing uses, so three weights were downloaded on every visit to
       style nothing. Playfair covers every serif on the site. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Preconnect to API backend -->
  <link rel="preconnect" href="https://arteva-maison-backend-gy1x.onrender.com" crossorigin />
  <link rel="dns-prefetch" href="https://arteva-maison-backend-gy1x.onrender.com" />

  <!-- Favicon.
       The previous /assets/images/favicon.png was a 1536x1024 photograph
       weighing 2.2 MB and was fetched on every page load. This SVG is under
       400 bytes and stays crisp at any size. -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />

  <!-- Set language/direction before the first paint so Arabic never renders
       left-to-right and then flips. Runs ahead of CSS and the app bundle. -->
  <script>
    (function () {
      try {
        var lang = localStorage.getItem('site_lang') || 'en';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) { /* storage blocked — the ltr default below stands */ }
    })();
  </script>

  <style>
    /* Instant branded loader — visible before React hydrates */
    #initialLoader {
      position: fixed; inset: 0; z-index: 99999;
      background: #F7F3EE;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #initialLoader .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 600; color: #1A1512; letter-spacing: 4px; text-indent: 4px; }
    #initialLoader .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; font-weight: 500; color: #A8844A; letter-spacing: 7px; text-indent: 7px; text-transform: uppercase; margin-top: 6px; }
    /* Same gesture as the in-app Loader, so the splash hands over to the app
       without the motion changing character mid-load. */
    #initialLoader .ring {
      position: relative; width: 46px; height: 46px; margin: 26px auto 0;
      border-radius: 50%; border: 2px solid #F4EADC;
    }
    #initialLoader .ring::after {
      content: ''; position: absolute; inset: -2px; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(168,132,74,0.06) 90deg, rgba(168,132,74,0.38) 210deg, #A8844A 320deg, transparent 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      animation: loaderSweep 1.9s cubic-bezier(0.62, 0.03, 0.35, 0.98) infinite;
    }
    #initialLoader .ring .core {
      position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
      border-radius: 50%; background: #A8844A;
      animation: loaderBreathe 2.6s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }
    @keyframes loaderSweep { to { transform: rotate(360deg); } }
    @keyframes loaderBreathe {
      0%, 100% { transform: scale(0.62); opacity: 0.35; }
      50%      { transform: scale(1);    opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #initialLoader .ring::after, #initialLoader .ring .core { animation: none; }
    }
    #initialLoader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
  </style>
</head>
<body>
  <!-- Brand loading screen -->
  <div id="initialLoader">
    <div style="text-align:center;">
      <div class="brand">ARTÉVA</div>
      <div class="sub">MAISON</div>
      <div class="ring"><span class="core"></span></div>
    </div>
  </div>

  <!-- React mount point -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
