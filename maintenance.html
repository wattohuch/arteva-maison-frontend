<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ARTEVA Maison is currently under maintenance. We'll be back shortly." />
  <title>ARTÉVA Maison | Under Maintenance</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0D0B09;
      color: #F7F3EE;
      overflow: hidden;
      position: relative;
    }

    /* Animated background gradient */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(168, 132, 74, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 100%, rgba(168, 132, 74, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse 50% 50% at 10% 60%, rgba(168, 132, 74, 0.04) 0%, transparent 50%);
      animation: ambientShift 12s ease-in-out infinite alternate;
    }

    @keyframes ambientShift {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* Subtle grid pattern overlay */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(168, 132, 74, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 132, 74, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .maintenance-container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem;
      max-width: 680px;
      width: 100%;
      animation: fadeInUp 1.2s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Brand logo area */
    .brand-mark {
      margin-bottom: 2.5rem;
    }

    .brand-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.4rem;
      font-weight: 600;
      color: #F7F3EE;
      letter-spacing: 8px;
      text-indent: 8px;
      margin-bottom: 0.3rem;
    }

    .brand-sub {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      color: #A8844A;
      letter-spacing: 10px;
      text-indent: 10px;
      text-transform: uppercase;
    }

    /* Decorative line */
    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #A8844A, transparent);
      margin: 2rem auto;
      position: relative;
    }

    .divider::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border: 1px solid #A8844A;
      transform: rotate(45deg);
      top: -4px;
      left: 50%;
      margin-left: -4px;
      background: #0D0B09;
    }

    /* Maintenance illustration */
    .maintenance-visual {
      width: 280px;
      height: 200px;
      margin: 0 auto 2.5rem;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(168, 132, 74, 0.1);
    }

    .maintenance-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7) saturate(0.8);
      transition: transform 8s ease-in-out;
    }

    .maintenance-visual:hover img {
      transform: scale(1.05);
    }

    .maintenance-visual::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13,11,9,0.2) 0%, rgba(13,11,9,0.5) 100%);
      pointer-events: none;
    }

    /* Animated gear icon */
    .gear-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 2rem;
      position: relative;
    }

    .gear-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: #A8844A;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: gearSpin 8s linear infinite;
    }

    @keyframes gearSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Heading */
    .maintenance-heading {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 500;
      color: #F7F3EE;
      margin-bottom: 1rem;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    /* Description */
    .maintenance-text {
      font-size: 0.95rem;
      font-weight: 300;
      color: rgba(247, 243, 238, 0.6);
      line-height: 1.8;
      max-width: 480px;
      margin: 0 auto 2.5rem;
    }

    /* Progress bar */
    .progress-container {
      max-width: 200px;
      margin: 0 auto 2.5rem;
    }

    .progress-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(168, 132, 74, 0.7);
      margin-bottom: 0.75rem;
    }

    .progress-bar {
      width: 100%;
      height: 2px;
      background: rgba(168, 132, 74, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #A8844A, #C9A96E);
      border-radius: 2px;
      animation: progressPulse 3s ease-in-out infinite;
    }

    @keyframes progressPulse {
      0% { width: 20%; opacity: 0.6; }
      50% { width: 70%; opacity: 1; }
      100% { width: 20%; opacity: 0.6; }
    }

    /* Contact info */
    .contact-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(247, 243, 238, 0.4);
      font-size: 0.8rem;
      font-weight: 400;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .contact-item:hover {
      color: #A8844A;
    }

    .contact-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      flex-shrink: 0;
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: rgba(168, 132, 74, 0.3);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .particle:nth-child(1) { top: 20%; left: 10%; animation: drift 18s ease-in-out infinite; }
    .particle:nth-child(2) { top: 60%; left: 85%; animation: drift 22s ease-in-out infinite 3s; }
    .particle:nth-child(3) { top: 80%; left: 30%; animation: drift 20s ease-in-out infinite 6s; }
    .particle:nth-child(4) { top: 10%; left: 70%; animation: drift 25s ease-in-out infinite 9s; }
    .particle:nth-child(5) { top: 50%; left: 50%; animation: drift 16s ease-in-out infinite 2s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      25% { transform: translate(30px, -20px) scale(1.5); opacity: 0.6; }
      50% { transform: translate(-20px, 30px) scale(0.8); opacity: 0.2; }
      75% { transform: translate(10px, -40px) scale(1.2); opacity: 0.5; }
    }

    /* Footer */
    .footer-text {
      margin-top: 3rem;
      font-size: 0.7rem;
      color: rgba(247, 243, 238, 0.2);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .brand-name { font-size: 1.8rem; letter-spacing: 6px; }
      .maintenance-heading { font-size: 1.4rem; }
      .maintenance-text { font-size: 0.85rem; }
      .maintenance-visual { width: 220px; height: 160px; }
      .contact-info { flex-direction: column; gap: 1rem; }
    }
  </style>
</head>
<body>
  <!-- Floating particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="maintenance-container">
    <!-- Brand -->
    <div class="brand-mark">
      <div class="brand-name">ARTÉVA</div>
      <div class="brand-sub">MAISON</div>
    </div>

    <!-- Decorative divider -->
    <div class="divider"></div>

    <!-- Gear icon -->
    <div class="gear-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>

    <!-- Maintenance image from internet -->
    <div class="maintenance-visual">
      <img 
        src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=600&q=80" 
        alt="Elegant workspace under construction"
        loading="eager"
      />
    </div>

    <!-- Heading -->
    <h1 class="maintenance-heading">We're Enhancing Your Experience</h1>

    <!-- Description -->
    <p class="maintenance-text">
      Our website is currently undergoing scheduled maintenance to bring you an even more refined shopping experience. We'll be back shortly.
    </p>

    <!-- Progress indicator -->
    <div class="progress-container">
      <div class="progress-label">Working on it</div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <!-- Contact options -->
    <div class="contact-info">
      <a href="mailto:info@artevamaison.com" class="contact-item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        info@artevamaison.com
      </a>
      <a href="https://instagram.com/artevamaison" class="contact-item" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        @artevamaison
      </a>
    </div>

    <!-- Footer -->
    <div class="footer-text">© 2026 ARTÉVA Maison. All rights reserved.</div>
  </div>
</body>
</html>
